# /etc/nginx/sites-available/apigee
# Self-signed TLS in front of the two Node backends.
# 443  -> backend-1 (localhost:3001)
# 8443 -> backend-2 (localhost:3002)

server {
    listen 443 ssl;
    server_name _;
    ssl_certificate     /etc/ssl/certs/apigee.crt;
    ssl_certificate_key /etc/ssl/private/apigee.key;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate     /etc/ssl/certs/apigee.crt;
    ssl_certificate_key /etc/ssl/private/apigee.key;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
