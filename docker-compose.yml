# Two backend instances + a Cloudflare named tunnel. No host ports exposed:
# cloudflared dials OUT to Cloudflare, so the server firewall stays fully closed.
services:
  backend-1:
    build: .
    environment:
      PORT: 3001
      SERVER_ID: backend-1
    restart: unless-stopped

  backend-2:
    build: .
    environment:
      PORT: 3001            # same internal port, different container + SERVER_ID
      SERVER_ID: backend-2
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared   # holds config.yml + <TUNNEL_ID>.json creds
    restart: unless-stopped
    depends_on:
      - backend-1
      - backend-2
