# Two backend instances + a Cloudflare named tunnel. No host ports exposed:
# cloudflared dials OUT to Cloudflare, so the server firewall stays fully closed.
services:
  backend-1:
    image: ghcr.io/arpit369/apigee-backend-test:latest
    environment:
      PORT: 3001
      SERVER_ID: backend-1
    restart: unless-stopped

  backend-2:
    image: ghcr.io/arpit369/apigee-backend-test:latest
    environment:
      PORT: 3001            # same internal port, different container + SERVER_ID
      SERVER_ID: backend-2
    restart: unless-stopped

  # Quick tunnels: no login, no domain. Each prints a random *.trycloudflare.com
  # URL (see logs). URLs change on every restart — update Apigee targets each time.
  tunnel-1:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://backend-1:3001
    restart: unless-stopped
    depends_on:
      - backend-1

  tunnel-2:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://backend-2:3001
    restart: unless-stopped
    depends_on:
      - backend-2

  # Keycloak = free OAuth/OIDC server for testing Apigee ServiceCallout (auth-code flow).
  # PROXY_HEADERS + HOSTNAME_STRICT=false let it work behind the quick tunnel without
  # knowing the random URL in advance (derives hostname from X-Forwarded-* headers).
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    # --import-realm auto-creates the apigee-demo realm + client + user rohan on
    # startup from keycloak/import/, so a fresh container is fully configured.
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: Admin123!
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
    restart: unless-stopped

  tunnel-keycloak:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://keycloak:8080
    restart: unless-stopped
    depends_on:
      - keycloak
