# Two backend instances + a Cloudflare named tunnel. No host ports exposed:
# cloudflared dials OUT to Cloudflare, so the server firewall stays fully closed.
services:
  backend-1:
    image: ghcr.io/arpit369/apigee-backend-test:latest
    environment:
      PORT: 3001
      SERVER_ID: backend-1
    restart: unless-stopped

  backend-2:
    image: ghcr.io/arpit369/apigee-backend-test:latest
    environment:
      PORT: 3001            # same internal port, different container + SERVER_ID
      SERVER_ID: backend-2
    restart: unless-stopped

  # Quick tunnels: no login, no domain. Each prints a random *.trycloudflare.com
  # URL (see logs). URLs change on every restart — update Apigee targets each time.
  tunnel-1:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://backend-1:3001
    restart: unless-stopped
    depends_on:
      - backend-1

  tunnel-2:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://backend-2:3001
    restart: unless-stopped
    depends_on:
      - backend-2
